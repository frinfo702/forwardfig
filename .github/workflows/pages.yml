name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}demo/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      # the docs site lives under /docs/ of the Pages site
      - run: bun run docs:build
        env:
          DOCS_BASE: /forwardfig/docs/
      # demo/ imports ../dist/, so ship both and send / to the demo
      - run: |
          mkdir site
          cp -r demo dist site/
          cp -r doc/dist site/docs
          # bust the browser cache (Pages serves max-age=600) on every deploy
          sed -i "s|../dist/forwardfig.js|../dist/forwardfig.js?v=${GITHUB_SHA::7}|" site/demo/index.html
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=demo/">' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
