name: publish
on:
  workflow_dispatch:
    inputs:
      bump:
        description: version bump
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write # push the version commit and tag
  id-token: write # npm trusted publishing (OIDC), no token secret needed
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # trusted publishing needs npm >= 11.5.1, which ships with Node 24
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }}
      # prepublishOnly runs check, test and build; push only after publish succeeds
      - run: npm publish
      - run: git push --follow-tags
